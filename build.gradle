plugins {
    id 'java'
    id 'war'
}

group 'com.parking'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.13.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.platform:jakarta.jakartaee-api:10.0.0')
    testImplementation('jakarta.platform:jakarta.jakartaee-api:10.0.0')

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
}

tasks.register('copyBootstrap', Copy) {
    onlyIf { file('node_modules/bootstrap/dist').exists() }
    from('node_modules/bootstrap/dist/css') {
        include 'bootstrap.min.css*'
        into 'css'
    }
    from('node_modules/bootstrap/dist/js') {
        include 'bootstrap.bundle.min.js*'
        into 'js'
    }
    into 'src/main/webapp'
}

tasks.named('war') {
    dependsOn 'copyBootstrap'
}
